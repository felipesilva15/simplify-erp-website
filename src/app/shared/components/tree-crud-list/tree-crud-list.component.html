<app-list-toolbar
    [facade]="facade()"
    [enableSearch]="enableSearch()"
    [searchPlaceholder]="searchPlaceholder()"
    [searchTerm]="searchTerm()"
    [formRoute]="formRoute()"
    [exportMenuItems]="exportMenuItems"
    (searchInput)="onSearchInput($event)"
    (searchClear)="onSearchClear()"
    (refresh)="facade().load()"
    (exportClick)="onExportMenuClick($event)"
/>

@if (facade().loading()) {
    <p-skeleton height="20rem" width="100%" />
} @else {
    <app-tree-view
        [nodes]="nodes()"
        [columns]="cols()"
        [levelColors]="levelColors()"
        [expandAll]="expandAll()"
        [contextMenu]="rowMenu"
        (contextMenuSelect)="onContextMenuSelect($event)"
    />
}

<app-filter-definer
    [visible]="facade().filterDefinitionVisible()"
    [fields]="filterFieldDefinition()"
    [fixedFilters]="facade().fixedFilters()"
    (apply)="facade().applyFilters($event)"
    (visibleChange)="facade().fitlersVisibleChange($event)"
/>

<p-menu #rowMenu [model]="menuItems" popup="true" appendTo="body" />
<p-menu #exportMenu [model]="exportMenuItems" popup="true" appendTo="body" />
