<app-form-page
    [title]="title()"
    [breadcrumbItems]="breadcrumbItems"
    [facade]="facade"
    >
    <ng-template appTemplate="content">
        @if (!facade.loading()) {
            <form class="flex flex-column gap-5 animation-duration-300 fadein" [formGroup]="form" (ngSubmit)="onSubmit()">
                <p-fluid class="grid">
                    <div class="col-12">
                        <span class="font-bold">Dados gerais</span>
                    </div>
                    <div class="col-12 md:col-6">
                        <app-form-label label="Nome" [form]="form" control="name"></app-form-label>
                        <input id="name" formControlName="name" pInputText [invalid]="isInvalid('name')" />
                        <app-form-control-errors [control]="form.get('name')"></app-form-control-errors>
                    </div>
                    <div class="col-12 md:col-6">
                        <app-form-label label="Usuário" [form]="form" control="username"></app-form-label>
                        <input id="username" formControlName="username" pInputText [invalid]="isInvalid('username')" />
                        <app-form-control-errors [control]="form.get('username')"></app-form-control-errors>
                    </div>
                    <div class="col-12 md:col-6">
                        <app-form-label label="E-mail" [form]="form" control="email"></app-form-label>
                        <input id="email" formControlName="email" pInputText [invalid]="isInvalid('email')" />
                        <app-form-control-errors [control]="form.get('email')"></app-form-control-errors>
                    </div>
                    <div class="col-12 md:col-6">
                        <app-form-label label="Telefone" [form]="form" control="phone_number"></app-form-label>
                        <input id="phone_number" mask="PHONE_BR" [dropSpecialCharacters]="true" formControlName="phone_number" pInputText [invalid]="isInvalid('phone_number')" />
                        <app-form-control-errors [control]="form.get('phone_number')"></app-form-control-errors>
                    </div>
                    @if (facade.isCreate()) {
                        <div class="col-12 md:col-6">
                            <app-form-label label="Senha" [form]="form" control="password"></app-form-label>
                            <p-password inputId="password" formControlName="password" [toggleMask]="true" [feedback]="false" autocomplete="off" [invalid]="isInvalid('password')" />
                            <app-form-control-errors [control]="form.get('password')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Confirmação da senha" [form]="form" control="password_confirmation"></app-form-label>
                            <p-password inputId="password_confirmation" formControlName="password_confirmation" [toggleMask]="true" [feedback]="false" autocomplete="off" [invalid]="isInvalid('password_confirmation')" />
                            <app-form-control-errors [control]="form.get('password_confirmation')"></app-form-control-errors>
                        </div>
                    }
                </p-fluid>
                <p-fluid class="grid">
                    <div class="col-12">
                        <span class="font-bold">Permissões & hierarquia</span>
                    </div>
                    <div class="col-12">
                        <app-form-label label="Perfis" [form]="form" control="roles"></app-form-label>
                        <app-role-lookup formControlName="roles" [multiple]="true"></app-role-lookup>
                    </div>
                    <div class="col-12">
                        <div class="flex align-items-center gap-1">
                            <p-toggleswitch name="is_admin" formControlName="is_admin" [invalid]="isInvalid('is_admin')" />
                            <app-form-label label="Administrador" [form]="form" control="is_admin"></app-form-label>
                        </div>
                        <p-message severity="secondary" size="small" variant="simple">Usuários administradores possuem permissão de realizar qualquer ação no sistema.</p-message>
                    </div>
                    <div class="col-12">
                        <div class="flex justify-content-end gap-2">
                            <p-button label="Voltar" [outlined]="true" [disabled]="facade.loading()" (onClick)="facade.navigateBack(form)" />
                            <p-button label="Salvar" icon="pi pi-save" type="submit" [disabled]="form.disabled" [loading]="facade.saving()" />
                        </div>
                    </div>
                </p-fluid>
            </form>
        } @else {
            <div class="flex flex-column gap-5">
                <p-fluid class="grid">
                    <div class="col-12">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                    </div>
                    <div class="col-12 md:col-6">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                        <p-skeleton width="100%" height="39px"></p-skeleton>
                    </div>
                    <div class="col-12 md:col-6">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                        <p-skeleton width="100%" height="39px"></p-skeleton>
                    </div>
                    <div class="col-12 md:col-6">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                        <p-skeleton width="100%" height="39px"></p-skeleton>
                    </div>
                    <div class="col-12 md:col-6">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                        <p-skeleton width="100%" height="39px"></p-skeleton>
                    </div>
                    @if (facade.isCreate()) {
                        <div class="col-12 md:col-6">
                            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                    }
                </p-fluid>
                <p-fluid class="grid"> 
                    <div class="col-12">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                    </div>
                    <div class="col-12">
                        <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
                        <p-skeleton width="100%" height="39px"></p-skeleton>
                    </div>
                    <div class="col-12">
                        <p-skeleton height="24px" width="30%" class="mb-2"></p-skeleton>
                        <p-skeleton width="80%" height="19px"></p-skeleton>
                    </div>
                    <div class="col-12">
                        <div class="flex justify-content-end gap-2">
                            <p-skeleton width="69px" height="39px"></p-skeleton>
                            <p-skeleton width="93px" height="39px"></p-skeleton>
                        </div>
                    </div>
                </p-fluid>
            </div>
        }
    </ng-template>
</app-form-page>
