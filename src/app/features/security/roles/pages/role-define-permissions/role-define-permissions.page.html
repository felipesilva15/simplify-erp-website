<app-form-page
    [title]="title()"
    [breadcrumbItems]="breadcrumbItems"
    [facade]="facade"
    >
    <ng-template appTemplate="content">
        @if (!this.facade.loading()) {
            <form class="flex flex-column gap-5 animation-duration-300 fadein" [formGroup]="form" (ngSubmit)="onSubmit()">
                <p-fluid class="grid">
                    <div class="col-12">
                        <p-treetable [value]="treeNode" [columns]="cols" selectionMode="checkbox" [(selectionKeys)]="selectionKeys" dataKey="key" [scrollable]="true" [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template #header let-columns>
                                <tr>
                                    @for (col of columns; track col) {
                                        <th>
                                            {{ col.header }}
                                        </th>
                                    }
                                </tr>
                            </ng-template>
                            <ng-template #body let-rowNode let-rowData="rowData" let-columns="columns">
                                <tr [ttRow]="rowNode" [ttSelectableRow]="rowNode" [classList]="colors[rowData['level']]">
                                    @for (col of columns; let first = $first; track col) {
                                        <td>
                                            @if (first) {
                                                <div class="flex align-items-center gap-2" >
                                                    <p-treetable-toggler [rowNode]="rowNode" />
                                                    <p-treetable-checkbox [value]="rowNode" />
                                                    <span>{{ rowData[col.field] }}</span>
                                                </div>
                                            } @else {
                                                {{ rowData[col.field] }}
                                            }
                                        </td>
                                    }
                                </tr>
                            </ng-template>
                        </p-treetable>
                    </div>
                    <div class="col-12">
                        <div class="flex justify-content-end gap-2">
                            <p-button label="Voltar" [outlined]="true" [disabled]="facade.loading()" (onClick)="facade.navigateBack(form)" />
                            <p-button label="Salvar" icon="pi pi-save" type="submit" [loading]="facade.saving()" />
                        </div>
                    </div>
                </p-fluid>
            </form>
        } @else {
            <p-fluid class="grid">
                <div class="col-12">
                    <p-skeleton height="10rem" width="100%" class="mb-2"></p-skeleton>
                </div>
                <div class="col-12">
                    <div class="flex justify-content-end gap-2">
                        <p-skeleton width="69px" height="39px"></p-skeleton>
                        <p-skeleton width="93px" height="39px"></p-skeleton>
                    </div>
                </div>
            </p-fluid>
        }
    </ng-template>
</app-form-page>
