<app-form-page
    [title]="title()"
    [breadcrumbItems]="breadcrumbItems"
    [facade]="facade"
    >
    <ng-template appTemplate="content">
        @if (!facade.loading()) {
            <form class="flex flex-column gap-5 animation-duration-300 fadein" [formGroup]="form" (ngSubmit)="onSubmit()">
                <app-collapsible-section title="Dados gerais">
                    <p-fluid class="grid">
                        <div class="col-12 md:col-8">
                            <app-form-label label="Nome" [form]="form" control="name"></app-form-label>
                            <input id="name" formControlName="name" pInputText [invalid]="isInvalid('name')" />
                            <app-form-control-errors [control]="form.get('name')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="Tipo de item" [form]="form" control="item_type_code"></app-form-label>
                            <p-select id="item_type_code" inputId="item_type_code" formControlName="item_type_code" appendTo="body" [options]="itemTypeCodeOptions" optionLabel="name" optionValue="code" placeholder="Selecione tipo de item" [invalid]="isInvalid('item_type_code')"></p-select>
                            <app-form-control-errors [control]="form.get('item_type_code')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="SKU" [form]="form" control="sku"></app-form-label>
                            <input id="sku" formControlName="sku" pInputText [invalid]="isInvalid('sku')" />
                            <app-form-control-errors [control]="form.get('sku')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="GTIN" [form]="form" control="gtin"></app-form-label>
                            <input id="gtin" formControlName="gtin" pInputText [invalid]="isInvalid('gtin')" />
                            <app-form-control-errors [control]="form.get('gtin')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="Unidade de medida" [form]="form" control="measurement_unit_id"></app-form-label>
                            <app-measurement-unit-lookup formControlName="measurement_unit_id"></app-measurement-unit-lookup>
                            <app-form-control-errors [control]="form.get('measurement_unit_id')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Categoria" [form]="form" control="product_category_id"></app-form-label>
                            <app-product-category-lookup formControlName="product_category_id"></app-product-category-lookup>
                            <app-form-control-errors [control]="form.get('product_category_id')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Marca" [form]="form" control="product_brand_id"></app-form-label>
                            <app-product-brand-lookup formControlName="product_brand_id"></app-product-brand-lookup>
                            <app-form-control-errors [control]="form.get('product_brand_id')"></app-form-control-errors>
                        </div>
                        <div class="col-12">
                            <app-form-label label="Descrição" [form]="form" control="description"></app-form-label>
                            <textarea id="description" formControlName="description" pTextarea rows="3" [invalid]="isInvalid('description')"></textarea>
                            <app-form-control-errors [control]="form.get('description')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Preço" [form]="form" control="price"></app-form-label>
                            <p-inputnumber inputId="price" formControlName="price" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="2" [invalid]="isInvalid('price')" />
                            <app-form-control-errors [control]="form.get('price')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Custo" [form]="form" control="cost"></app-form-label>
                            <p-inputnumber inputId="cost" formControlName="cost" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="2" [invalid]="isInvalid('cost')" />
                            <app-form-control-errors [control]="form.get('cost')"></app-form-control-errors>
                        </div>
                    </p-fluid>
                </app-collapsible-section>
                <app-collapsible-section title="Armazenamento e estoque">
                    <p-fluid class="grid">
                        <div class="col-12 md:col-6">
                            <app-form-label label="Peso bruto" [form]="form" control="gross_weight"></app-form-label>
                            <p-inputnumber inputId="gross_weight" formControlName="gross_weight" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="3" [invalid]="isInvalid('gross_weight')" />
                            <app-form-control-errors [control]="form.get('gross_weight')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Peso líquido" [form]="form" control="net_weight"></app-form-label>
                            <p-inputnumber inputId="net_weight" formControlName="net_weight" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="3" [invalid]="isInvalid('net_weight')" />
                            <app-form-control-errors [control]="form.get('net_weight')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="Altura" [form]="form" control="width"></app-form-label>
                            <p-inputnumber inputId="width" formControlName="width" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="4" [invalid]="isInvalid('width')" />
                            <app-form-control-errors [control]="form.get('width')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="Largura" [form]="form" control="height"></app-form-label>
                            <p-inputnumber inputId="height" formControlName="height" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="4" [invalid]="isInvalid('height')" />
                            <app-form-control-errors [control]="form.get('height')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-4">
                            <app-form-label label="Comprimento" [form]="form" control="length"></app-form-label>
                            <p-inputnumber inputId="length" formControlName="length" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="4" [invalid]="isInvalid('length')" />
                            <app-form-control-errors [control]="form.get('length')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Estoque mínimo" [form]="form" control="minimum_stock"></app-form-label>
                            <p-inputnumber inputId="minimum_stock" formControlName="minimum_stock" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="4" [invalid]="isInvalid('minimum_stock')" />
                            <app-form-control-errors [control]="form.get('minimum_stock')"></app-form-control-errors>
                        </div>
                        <div class="col-12 md:col-6">
                            <app-form-label label="Estoque máximo" [form]="form" control="maximum_stock"></app-form-label>
                            <p-inputnumber inputId="maximum_stock" formControlName="maximum_stock" mode="decimal" [showButtons]="true" [minFractionDigits]="2" [maxFractionDigits]="4" [invalid]="isInvalid('maximum_stock')" />
                            <app-form-control-errors [control]="form.get('maximum_stock')"></app-form-control-errors>
                        </div>
                    </p-fluid>
                </app-collapsible-section>
                <app-collapsible-section title="Informações complementares">
                    <p-fluid class="grid">
                        <div class="col-12">
                            <app-form-label label="Observações" [form]="form" control="notes"></app-form-label>
                            <textarea id="notes" formControlName="notes" pTextarea rows="3" [invalid]="isInvalid('notes')"></textarea>
                            <app-form-control-errors [control]="form.get('notes')"></app-form-control-errors>
                        </div>
                    </p-fluid>
                </app-collapsible-section>
                <p-fluid class="grid">
                    <div class="col-12">
                        <div class="flex justify-content-end gap-2">
                            <p-button label="Voltar" [outlined]="true" [disabled]="facade.loading()" (onClick)="facade.navigateBack(form)" />
                            <p-button label="Salvar" icon="pi pi-save" type="submit" [disabled]="form.disabled" [loading]="facade.saving()" />
                        </div>
                    </div>
                </p-fluid>
            </form>
        } @else {
            <div class="flex flex-column gap-5">
                <section class="flex flex-column gap-3">
                    <div class="flex align-items-center justify-content-between w-full">
                        <p-skeleton height="16px" width="20%" borderRadius="4px"></p-skeleton>
                        <p-skeleton width="14px" height="14px" shape="circle"></p-skeleton>
                    </div>
                    <p-fluid class="grid">
                        <div class="col-12 md:col-8">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="123px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                    </p-fluid>
                </section>

                <section class="flex flex-column gap-3">
                    <div class="flex align-items-center justify-content-between w-full">
                        <p-skeleton height="16px" width="14%" borderRadius="4px"></p-skeleton>
                        <p-skeleton width="14px" height="14px" shape="circle"></p-skeleton>
                    </div>
                    <p-fluid class="grid">
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-4">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                        <div class="col-12 md:col-6">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="39px"></p-skeleton>
                        </div>
                    </p-fluid>
                </section>

                <section class="flex flex-column gap-3">
                    <div class="flex align-items-center justify-content-between w-full">
                        <p-skeleton height="16px" width="22%" borderRadius="4px"></p-skeleton>
                        <p-skeleton width="14px" height="14px" shape="circle"></p-skeleton>
                    </div>
                    <p-fluid class="grid">
                        <div class="col-12">
                            <p-skeleton height="14px" width="30%" class="mb-2"></p-skeleton>
                            <p-skeleton width="100%" height="123px"></p-skeleton>
                        </div>
                    </p-fluid>
                </section>

                <p-fluid class="grid">
                    <div class="col-12">
                        <div class="flex justify-content-end gap-2">
                            <p-skeleton width="69px" height="39px" borderRadius="6px"></p-skeleton>
                            <p-skeleton width="93px" height="39px" borderRadius="6px"></p-skeleton>
                        </div>
                    </div>
                </p-fluid>
            </div>
        }
    </ng-template>
</app-form-page>
