<app-form-dialog [facade]="facade">
  <ng-template appTemplate="content">
    @if (!facade.loading()) {
      <form class="flex flex-column gap-5 animation-duration-300 fadein" [formGroup]="form" (ngSubmit)="onSubmit()">
        <p-fluid class="grid">
          <div class="col-12">
            <label htmlFor="name">Nome<span class="text-red-500 font-bold">*</span></label>
            <input id="name" formControlName="name" pInputText required [invalid]="isInvalid('name')" />
            <app-form-control-errors [control]="form.get('name')"></app-form-control-errors>
          </div>
          <div class="col-12">
            <label htmlFor="parent_category_id">Categoria pai</label>
            <app-product-category-lookup formControlName="parent_category_id"></app-product-category-lookup>
            <app-form-control-errors [control]="form.get('parent_category_id')"></app-form-control-errors>
          </div>
          <div class="col-12">
            <label htmlFor="applicability">Aplicabilidade<span class="text-red-500 font-bold">*</span></label>
            <p-select id="applicability" inputId="applicability" formControlName="applicability" appendTo="body" [options]="productApplicabilityOptions" optionLabel="name" optionValue="code" placeholder="Selecione a aplicabilidade" [invalid]="isInvalid('applicability')"></p-select>
            <app-form-control-errors [control]="form.get('applicability')"></app-form-control-errors>
          </div>
        </p-fluid>
      </form>
    } @else {
      <p-fluid class="grid">
          <div class="col-12">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
      </p-fluid>
    }
  </ng-template>
  <ng-template appTemplate="footer">
    <p-button label="Salvar" icon="pi pi-save" [disabled]="form.disabled || facade.loading()" [loading]="facade.saving()" (onClick)="onSubmit()" />
  </ng-template>
</app-form-dialog>
