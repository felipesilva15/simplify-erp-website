<app-form-dialog [facade]="facade">
  <ng-template appTemplate="content">
    @if (!facade.loading()) {
      <form class="flex flex-column gap-5 animation-duration-300 fadein" [formGroup]="form" (ngSubmit)="onSubmit()">
        <p-fluid class="grid">
          <div class="col-12 md:col-8">
            <app-form-label label="Nome" [form]="form" control="name"></app-form-label>
            <input id="name" formControlName="name" pInputText [invalid]="isInvalid('name')" />
            <app-form-control-errors [control]="form.get('name')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Condição" [form]="form" control="condition"></app-form-label>
            <input id="condition" formControlName="condition" pInputText [invalid]="isInvalid('condition')" />
            <app-form-control-errors [control]="form.get('condition')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-6">
            <app-form-label label="Tipo de pagamento" [form]="form" control="payment_type"></app-form-label>
            <p-select id="payment_type" inputId="payment_type" formControlName="payment_type" appendTo="body" [options]="paymentTypeOptions" optionLabel="name" optionValue="code" placeholder="Selecione tipo de pagamento" [invalid]="isInvalid('payment_type')"></p-select>
            <app-form-control-errors [control]="form.get('payment_type')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-6">
            <app-form-label label="Aplicável a" [form]="form" control="applicable_type"></app-form-label>
            <p-select id="applicable_type" inputId="applicable_type" formControlName="applicable_type" appendTo="body" [options]="financeApplicabilityOptions" optionLabel="name" optionValue="code" placeholder="Selecione aplicável a" [invalid]="isInvalid('applicable_type')"></p-select>
            <app-form-control-errors [control]="form.get('applicable_type')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Tipo de taxa" [form]="form" control="tax_type"></app-form-label>
            <p-select id="tax_type" inputId="tax_type" formControlName="tax_type" appendTo="body" [options]="taxTypeOptions" optionLabel="name" optionValue="code" [showClear]="true" placeholder="Selecione tipo de taxa" [invalid]="isInvalid('tax_type')"></p-select>
            <app-form-control-errors [control]="form.get('tax_type')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Alíquota da taxa" [form]="form" control="tax_aliquot"></app-form-label>
            <p-inputnumber inputId="tax_aliquot" formControlName="tax_aliquot" [showButtons]="true" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="4" suffix="%" [invalid]="isInvalid('tax_aliquot')" />
            <app-form-control-errors [control]="form.get('tax_aliquot')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Valor fixo da taxa" [form]="form" control="tax_fixed_value"></app-form-label>
            <p-inputnumber inputId="tax_fixed_value" formControlName="tax_fixed_value" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2" [showButtons]="true" [invalid]="isInvalid('tax_fixed_value')" />
            <app-form-control-errors [control]="form.get('tax_fixed_value')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Multa" [form]="form" control="penalty_aliquot"></app-form-label>
            <p-inputnumber inputId="penalty_aliquot" formControlName="penalty_aliquot" [showButtons]="true" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="4" suffix="%" [invalid]="isInvalid('penalty_aliquot')" />
            <app-form-control-errors [control]="form.get('penalty_aliquot')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Juros (Mensal)" [form]="form" control="interest_aliquot"></app-form-label>
            <p-inputnumber inputId="interest_aliquot" formControlName="interest_aliquot" [showButtons]="true" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="4" suffix="%" [invalid]="isInvalid('interest_aliquot')" />
            <app-form-control-errors [control]="form.get('interest_aliquot')"></app-form-control-errors>
          </div>
          <div class="col-12 md:col-4">
            <app-form-label label="Prazo de pagamento (Dias)" [form]="form" control="payment_deadline"></app-form-label>
            <p-inputnumber inputId="payment_deadline" formControlName="payment_deadline" [showButtons]="true" [invalid]="isInvalid('payment_deadline')" />
            <app-form-control-errors [control]="form.get('payment_deadline')"></app-form-control-errors>
          </div>
        </p-fluid>
      </form>
    } @else {
      <p-fluid class="grid">
          <div class="col-12 md:col-8">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-6">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-6">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
          <div class="col-12 md:col-4">
            <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
            <p-skeleton width="100%" height="39px"></p-skeleton>
          </div>
      </p-fluid>
    }
  </ng-template>
  <ng-template appTemplate="footer">
    <p-button label="Salvar" icon="pi pi-save" [disabled]="form.disabled || facade.loading()" [loading]="facade.saving()" (onClick)="onSubmit()" />
  </ng-template>
</app-form-dialog>
