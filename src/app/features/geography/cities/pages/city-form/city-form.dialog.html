<app-form-dialog [facade]="facade">
  <ng-template appTemplate="content">
    @if (!facade.loading()) {
      <form class="flex flex-column gap-5 animation-duration-300 fadein" [formGroup]="form" (ngSubmit)="onSubmit()">
        <p-fluid class="grid">
            <div class="col-12">
                <app-form-label label="Nome" [form]="form" control="name"></app-form-label>
                <input id="name" formControlName="name" pInputText [invalid]="isInvalid('name')" />
                <app-form-control-errors [control]="form.get('name')"></app-form-control-errors>
            </div>
            <div class="col-12">
                <app-form-label label="Código IBGE" [form]="form" control="ibge_code"></app-form-label>
                <input id="ibge_code" formControlName="ibge_code" pInputText [invalid]="isInvalid('ibge_code')" />
                <app-form-control-errors [control]="form.get('ibge_code')"></app-form-control-errors>
            </div>
            <div class="col-12">
                <app-form-label label="Estado" [form]="form" control="state_id"></app-form-label>
                <app-state-lookup formControlName="state_id"></app-state-lookup>
                <app-form-control-errors [control]="form.get('state_id')"></app-form-control-errors>
            </div>
        </p-fluid>
      </form>
    } @else {
      <p-fluid class="grid">
        <div class="col-12">
          <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
          <p-skeleton width="100%" height="39px"></p-skeleton>
        </div>
        <div class="col-12">
          <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
          <p-skeleton width="100%" height="39px"></p-skeleton>
        </div>
        <div class="col-12">
          <p-skeleton height="16px" width="20%" class="mb-2"></p-skeleton>
          <p-skeleton width="100%" height="39px"></p-skeleton>
        </div>
      </p-fluid>
    }
  </ng-template>
  <ng-template appTemplate="footer">
    <p-button label="Salvar" icon="pi pi-save" [disabled]="form.disabled || facade.loading()" [loading]="facade.saving()" (onClick)="onSubmit()" />
  </ng-template>
</app-form-dialog>
